<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover publicly accessible educational resources with EduSearch."
    />
    <meta name="theme-color" content="#fbf8f4" />
    <title>EduSearch — Find knowledge worth learning</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="EduSearch home">
          <span class="wordmark-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path
                d="M7.5 11.5c4.7-.9 9.1.2 12.5 3.1v17c-3.4-2.9-7.8-4-12.5-3.1v-17Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M32.5 11.5c-4.7-.9-9.1.2-12.5 3.1v17c3.4-2.9 7.8-4 12.5-3.1v-17Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M12 17.5c2.2-.2 4.1.2 5.8 1.2M28 17.5c-2.2-.2-4.1.2-5.8 1.2"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>EduSearch</span>
        </a>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <h1 id="hero-title">Find knowledge worth learning.</h1>
          <div class="search-widget" id="search-widget">
            <form class="search-form" id="search-form" role="search">
              <label class="visually-hidden" for="search-query">Search educational resources</label>
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7" />
                <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <input
                id="search-query"
                name="q"
                type="search"
                placeholder="What would you like to learn?"
                autocomplete="off"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="suggestion-list"
                aria-expanded="false"
              />
              <button id="search-button" type="submit">
                <span>Search</span>
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </form>
            <ul
              class="suggestion-list"
              id="suggestion-list"
              role="listbox"
              aria-label="Search suggestions"
              hidden
            ></ul>
          </div>
          <details class="filters-panel">
            <summary>Filters</summary>
            <div class="filters-content">
              <div class="filters-grid">
                <label>
                  <span>Education level</span>
                  <input id="filter-education-level" data-search-filter="education_level" maxlength="100" autocomplete="off" />
                </label>
                <label>
                  <span>Subject</span>
                  <input id="filter-subject" data-search-filter="subject" maxlength="200" autocomplete="off" />
                </label>
                <label>
                  <span>Content type</span>
                  <input id="filter-content-type" data-search-filter="content_type" maxlength="100" autocomplete="off" />
                </label>
                <label>
                  <span>Language</span>
                  <input id="filter-language" data-search-filter="language" maxlength="35" autocomplete="off" />
                </label>
                <label>
                  <span>Domain</span>
                  <input id="filter-domain" data-search-filter="domain" maxlength="253" autocomplete="off" />
                </label>
                <label>
                  <span>Difficulty</span>
                  <input id="filter-difficulty" data-search-filter="difficulty" maxlength="50" autocomplete="off" />
                </label>
              </div>
              <button class="clear-filters-button" id="clear-filters" type="button">
                Clear filters
              </button>
            </div>
          </details>
          <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
          <p class="search-caption">Search educational resources</p>
        </section>

        <section
          class="results-section"
          id="results-section"
          aria-label="Search results"
          aria-live="polite"
          aria-busy="false"
          hidden
        >
          <div class="results-heading">
            <h2 id="results-title"></h2>
            <span class="loading-indicator" id="loading-indicator" aria-hidden="true" hidden></span>
          </div>
          <ol class="results-list" id="results-list"></ol>
        </section>
      </main>
    </div>
  </body>
</html>
