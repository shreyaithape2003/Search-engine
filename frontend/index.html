<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover publicly accessible educational resources with EduSearch."
    />
    <meta name="theme-color" content="#fbf8f4" />
    <title>EduSearch — Find knowledge worth learning</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="EduSearch home">
          <span class="wordmark-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path
                d="M7.5 11.5c4.7-.9 9.1.2 12.5 3.1v17c-3.4-2.9-7.8-4-12.5-3.1v-17Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M32.5 11.5c-4.7-.9-9.1.2-12.5 3.1v17c3.4-2.9 7.8-4 12.5-3.1v-17Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M12 17.5c2.2-.2 4.1.2 5.8 1.2M28 17.5c-2.2-.2-4.1.2-5.8 1.2"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>EduSearch</span>
        </a>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <h1 id="hero-title">Find knowledge worth learning.</h1>
          <form class="search-form" id="search-form" role="search">
            <label class="visually-hidden" for="search-query">Search educational resources</label>
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7" />
              <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            <input
              id="search-query"
              name="q"
              type="search"
              placeholder="What would you like to learn?"
              autocomplete="off"
            />
            <button type="submit">
              <span>Search</span>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </form>
          <p class="search-status" id="search-status" aria-live="polite"></p>
          <p class="search-caption">Search educational resources</p>
        </section>
      </main>
    </div>
  </body>
</html>
